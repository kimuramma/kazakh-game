<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Карта уроков</title>
<style>
@font-face{font-family:"Game";src:url(fonts/inter-Bold.otf) format("opentype");font-weight:700 800}
@font-face{font-family:"Game";src:url(fonts/inter-ExtraBold.otf) format("opentype");font-weight:900}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#2a1a0e;font-family:"Game",Roboto,Arial,sans-serif;overflow:hidden}
#wrap{height:100%;display:flex;align-items:center;justify-content:center}
#app{position:relative;height:100%;width:min(100vw,calc(100vh*9/16));container-type:size;background:#4f8f2a;overflow:hidden}
#map{position:absolute;top:0;left:50%;translate:-50% 0;height:calc(100cqh - 20cqw);width:calc((100cqh - 20cqw)*1024/1536);container-type:inline-size;overflow:hidden;
  background:url(img/map1.jpg) center/100% 100% no-repeat;user-select:none}
.abs{position:absolute}
button{font-family:inherit;border:none;background:none;padding:0;cursor:pointer;color:inherit}

#title{left:50%;top:1%;translate:-50% 0;width:74%;aspect-ratio:1000/136;background:url(img/ui_plank.png) center/100% 100% no-repeat;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding-left:6cqw;color:#5a3010;z-index:5;filter:drop-shadow(0 0.8cqw 0.8cqw rgba(0,0,0,.3))}
#title b{font-size:4cqw;font-weight:900;line-height:1;margin-top:0.6cqw}
#title span{font-size:3cqw;font-weight:800;color:#8a5a2e}

.node{translate:-50% -50%;z-index:3;border-radius:50%;transition:transform .12s}
.node:active{transform:scale(.92)}
.node .tint{position:absolute;inset:0;border-radius:50%}
.node.locked .tint{background:rgba(70,55,40,.55);mix-blend-mode:multiply}
.node.done .tint{background:#5fd13a;mix-blend-mode:color}
.node.cur .tint{background:#ffd23a;mix-blend-mode:color}
.node.cur::before{content:"";position:absolute;inset:-70% -45%;border-radius:50%;background:radial-gradient(rgba(255,245,160,.85),rgba(255,215,60,.4) 45%,rgba(255,200,0,0) 70%);animation:glow 1.6s ease-in-out infinite;z-index:-1;pointer-events:none}
@keyframes glow{0%,100%{opacity:.55;transform:scale(.9)}50%{opacity:1;transform:scale(1.08)}}
.node .num{position:absolute;inset:-20% 0 0 0;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;
  -webkit-text-stroke:0.6cqw #6b3510;paint-order:stroke fill;text-shadow:0 0.5cqw 0 #6b3510;line-height:1}
.node.locked .num{-webkit-text-stroke:0;text-shadow:0 0.3cqw 0.4cqw rgba(0,0,0,.4)}
.node .flag{position:absolute;left:55%;bottom:45%;width:55%;pointer-events:none}
#chestHit{left:52.2%;top:10.9%;width:11%;aspect-ratio:1.1;translate:-50% -50%;z-index:7;border-radius:30%}
#chestHit.ready::before{content:"";position:absolute;inset:-35%;border-radius:50%;background:radial-gradient(rgba(255,245,160,.9),rgba(255,210,60,.45) 45%,rgba(255,200,0,0) 70%);mix-blend-mode:screen;animation:glow 1.2s ease-in-out infinite}
#pts{right:3%;top:6.5%;z-index:6;background:linear-gradient(#fff6e2,#f3dfb6);border:0.6cqw solid #8a5a2e;border-radius:3cqw;padding:1cqw 2.6cqw;font-weight:900;font-size:3.8cqw;color:#3d220d;box-shadow:0 0.8cqw 0 #5a3417}
.fly{position:absolute;z-index:40;font-weight:900;font-size:6cqw;color:#ffd23f;text-shadow:0 0.6cqw 0 #a0600a,0 0 1cqw #fff;pointer-events:none;transition:all 1.1s cubic-bezier(.3,.8,.4,1)}
#start{z-index:20;left:50%;translate:-50% 0;width:70%;background:linear-gradient(#fff6e2,#f3dfb6);border:0.9cqw solid #8a5a2e;border-radius:4cqw;padding:3cqw;text-align:center;
  box-shadow:0 1.4cqw 0 #5a3417;display:none}
#start.on{display:block;animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
#start b{display:block;font-size:4.8cqw;color:#3d220d}
#start .num{display:inline-block;font-size:3cqw;font-weight:900;color:#fff;background:#8a5a2e;border-radius:2cqw;padding:0.4cqw 2cqw;margin-bottom:1.2cqw}
#start .pic{height:18cqw;display:flex;align-items:center;justify-content:center;margin:0.4cqw 0 1cqw}
#start .pic img{max-height:100%;max-width:60%;filter:drop-shadow(0 1cqw 1cqw rgba(0,0,0,.25))}
#start .pic span{font-size:14cqw;line-height:1;filter:drop-shadow(0 1cqw 1cqw rgba(0,0,0,.2))}
#start .kz{display:block;font-size:4.2cqw;font-weight:900;color:#2f6f18;margin-top:0.6cqw}
#start .ph{display:block;font-size:3.1cqw;font-weight:800;color:#8a5a2e;background:#fff;border:0.4cqw dashed #d6b98a;border-radius:2cqw;padding:1cqw 1.6cqw;margin:1.6cqw 0 2.4cqw}

.go{width:100%;min-height:10cqw;border-radius:3cqw;font-size:4.6cqw;font-weight:900;color:#3d220d;background:linear-gradient(#ffe066,#ffb92e);border:0.6cqw solid #b97a12;box-shadow:0 1cqw 0 #8a5a0c}
.go:active{transform:translateY(0.8cqw);box-shadow:0 0.2cqw 0 #8a5a0c}


#intro{inset:0;z-index:50;display:none}
#intro.on{display:block}
#ia{position:absolute;left:8%;width:26%;top:104%;transform-origin:50% 100%;filter:drop-shadow(0 1cqw 0.8cqw rgba(0,0,0,.35));transition:top .35s cubic-bezier(.3,1.5,.5,1)}
#ia.squash{animation:squash .35s ease}
#ia.growl{animation:growl .1s linear 8}
#ia.look{animation:look 1s ease}
#ia.run{transition:top .8s ease-in,left .8s ease-in,width .8s ease-in;}
@keyframes squash{0%{transform:scale(1.15,.82)}60%{transform:scale(.94,1.06)}100%{transform:none}}
@keyframes growl{0%,100%{transform:translateX(0)}50%{transform:translateX(3%) rotate(2deg)}}
@keyframes look{0%,100%{transform:none}30%{transform:scaleX(-1)}60%{transform:none}}
#ib{position:absolute;left:34%;bottom:62cqw;max-width:62%;background:#fffdf6;border:0.6cqw solid #5a3417;border-radius:3.5cqw;padding:2.2cqw 3.2cqw;font-weight:900;color:#3d220d;font-size:4.4cqw;line-height:1.2;
  box-shadow:0 1cqw 0 rgba(0,0,0,.25);opacity:0;transform:scale(.6);transition:all .25s cubic-bezier(.3,1.6,.5,1)}
#ib.on{opacity:1;transform:none}
#ib small{display:block;font-size:3.3cqw;color:#8a5a2e;font-weight:700;margin-top:0.8cqw}
#ib::after{content:"";position:absolute;width:3.4cqw;height:3.4cqw;background:#fffdf6;border:0.6cqw solid #5a3417;border-top-color:transparent;border-left-color:transparent;left:-2.1cqw;bottom:22%;transform:rotate(135deg)}
#ibtn{position:absolute;left:34%;bottom:40cqw;width:50%;display:none}
#ibtn.on{display:block;animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
#whiteout{inset:0;background:#fff;opacity:0;pointer-events:none;z-index:60;transition:opacity .45s}
#yardBtn{left:3%;bottom:2%;z-index:6;width:11cqw;height:11cqw;border-radius:50%;background:linear-gradient(#fff6e2,#f3dfb6);border:0.6cqw solid #8a5a2e;box-shadow:0 0.8cqw 0 #5a3417;font-size:5.6cqw}

#enSlot{left:3%;top:11.5%;z-index:6}


#deckBox{inset:0;z-index:40;background:rgba(40,20,5,.6);display:none;align-items:center;justify-content:center}
#deckBox.on{display:flex}
#gridCard{width:92%;max-height:88%;overflow:auto;background:linear-gradient(#fff6e2,#f3dfb6);border:1cqw solid #8a5a2e;border-radius:5cqw;padding:3.6cqw;box-shadow:0 1.6cqw 0 #5a3417;animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
#gHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:3cqw}
#gHead b{font-size:4.6cqw;color:#3d220d}
#deckClose{width:9cqw;height:9cqw;border-radius:50%;background:#fff;border:0.6cqw solid #8a5a2e;font-size:4.4cqw;font-weight:900;color:#8a5a2e;box-shadow:0 0.6cqw 0 #5a3417}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2.6cqw}
.blk{position:relative;aspect-ratio:1/1.1;border-radius:3.4cqw;background:#fff;border:0.7cqw solid #d6b98a;box-shadow:0 1cqw 0 #b98a4a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1cqw;cursor:pointer;transition:transform .1s}
.blk:active{transform:translateY(0.8cqw);box-shadow:0 0.2cqw 0 #b98a4a}
.blk .ph{height:55%;display:flex;align-items:center;justify-content:center}
.blk .ph img{max-height:100%;max-width:80%} .blk .ph span{font-size:12cqw;line-height:1}
.blk b{font-size:3.4cqw;color:#3d220d}
.blk.done{border-color:#4caf3a;box-shadow:0 1cqw 0 #2f7a22}
.blk.done::after{content:"✓";position:absolute;right:-1.4cqw;top:-1.4cqw;width:7cqw;height:7cqw;border-radius:50%;background:#4caf3a;color:#fff;font-weight:900;font-size:4cqw;display:flex;align-items:center;justify-content:center;border:0.5cqw solid #fff}
.blk.cur{border-color:#ffb92e;box-shadow:0 0 0 0.6cqw #ffe066,0 0 3cqw 0.6cqw rgba(255,210,60,.8),0 1cqw 0 #b97a12}
.blk.locked::after{content:"🔒";position:absolute;right:-1.2cqw;top:-1.2cqw;width:7cqw;height:7cqw;border-radius:50%;background:#8a5a2e;font-size:3.6cqw;display:flex;align-items:center;justify-content:center;border:0.5cqw solid #fff}
.blk.test{grid-column:1/-1;aspect-ratio:auto;flex-direction:row;gap:4cqw;padding:2.4cqw;background:linear-gradient(#fff3b0,#ffd54a);border-color:#e0a21a;box-shadow:0 1cqw 0 #b97a12}
.blk.test .ph{height:auto} .blk.test .ph span{font-size:11cqw}
.blk .tx{display:flex;flex-direction:column;text-align:left} .blk .tx b{font-size:5cqw} .blk .tx small{font-size:3.2cqw;font-weight:800;color:#8a5a2e}
#toast{left:50%;bottom:24cqw;translate:-50% 0;z-index:30;background:rgba(40,20,5,.85);color:#fff;font-weight:800;font-size:3.6cqw;padding:2cqw 4cqw;border-radius:3cqw;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
#demo{right:3%;bottom:21cqw;z-index:25;font-size:2.8cqw;font-weight:800;color:#fff;background:rgba(40,20,5,.55);padding:1.2cqw 2.4cqw;border-radius:3cqw}
</style>
<script src="nav.js"></script>
<script src="rig.js"></script>
</head>
<body>
<div id="wrap"><div id="app"><div id="map">
      <button id="chestHit" class="abs" aria-label="Сундук"></button>
</div>
  <div id="title" class="abs"><b>Глава 1 · Первые шаги</b></div>
    <div id="pts" class="abs">⭐ <span id="ptsN">0</span></div>
  <div id="intro" class="abs"><div id="ia"></div><div id="ib"></div><button class="go" id="ibtn">Идём! 🛒</button></div>
  <div id="whiteout" class="abs"></div>
  <div id="toast" class="abs"></div>
  <button id="demo" class="abs">тест: урок пройден ✓</button>
  <div id="deckBox" class="abs"><div id="gridCard"><div id="gHead"><b>Раздел 1 · Магазин у дома</b><button id="deckClose">✕</button></div><div id="grid"></div></div></div>
</div></div>
<script>
const $=id=>document.getElementById(id);
const W=1024,H=1536;
const NODES=[[393,1370,116,60],[571,1272,114,59],[647,1133,110,57],[487,1007,107,56],[578,884,104,54],[695,788,102,53],[558,647,99,51],[661,511,95,50],[473,432,93,48],[574,290,90,47]];
const TOPICS=[["Магазин у дома", "🏪", [["Хлеб", "🍞", "img/bread.png"], ["Молоко и айран", "🥛", "img/p/milk.png"], ["Масло и сметана", "🧈", "img/p/butter.png"], ["Яйца", "🥚", "img/p/eggs.png"], ["Сыр и курт", "🧀", "img/p/cheese.png"], ["Фрукты", "🍎", "img/p/grapes.png"], ["Секрет языка", "🔍"], ["Повторение", "🔁"], ["SMS от мамы", "📱", "img/p/basket.png"]]], ["Двор и соседи", "🏡", [["Знакомство", "👋", "img/t2/banana.png"], ["Как дела?", "😊", "img/t2/apa.png"], ["Откуда ты?", "🗺️"], ["Сколько лет?", "🎂"], ["Мой дом", "🏠"], ["Двор", "🌳"], ["Цвета", "🎨", "img/t2/dog.png"], ["Кто это? Что это?", "❓", "img/t2/cat.png"], ["Вежливые слова", "🙏"]]], ["Семья", "👨‍👩‍👧", [["Мама и папа", "👪", "img/t3/mom.png"], ["Братья и сёстры", "👫", "img/t3/brother.png"], ["Бабушка и дедушка", "👵", "img/t3/grandma.png"], ["У меня есть…", "🎁", "img/t2/dog.png"], ["Возраст", "🔢"], ["Профессии", "💼", "img/t3/dad.png"], ["Характер", "😇", "img/t3/grandpa.png"], ["Семейное фото", "📷"], ["Семейный ужин", "🍲"]]], ["Мой дом", "🛋️", [["Комнаты", "🛏️"], ["Мебель", "🪑"], ["Где лежит?", "📦"], ["Уборка", "🧹"], ["Утро", "☀️"], ["Кухня", "🍳"], ["Чай по-казахски", "🫖"], ["Где мои вещи?", "🔑"], ["Гости пришли", "🚪"]]], ["Базар", "🧺", [["На базаре", "🛒"], ["Овощи", "🥕"], ["Фрукты и ягоды", "🍇"], ["Вес", "⚖️"], ["Числа до 1000", "💯"], ["Торгуемся", "🤝"], ["Мясо и молочное", "🥩"], ["Сладости", "🍬"], ["Сумка тяжёлая!", "🛍️"]]], ["Кафе", "☕", [["Пришли в кафе", "🍽️"], ["Делаем заказ", "📝"], ["Напитки", "🥤"], ["Горячее", "🍜"], ["Десерт", "🍰"], ["Нравится?", "👍"], ["Счёт", "🧾"], ["С собой", "🥡"], ["День рождения", "🎉"]]], ["Парк и погода", "🌤️", [["Какая погода?", "🌤️"], ["Тепло и холодно", "🌡️"], ["Времена года", "🍂"], ["Зонт и куртка", "☂️"], ["Игры в парке", "⚽"], ["Животные", "🐶"], ["Дни недели", "📅"], ["Пикник", "🧺"], ["Фото на память", "📸"]]], ["Школа", "🏫", [["Первый день", "🏫"], ["Школьные вещи", "✏️"], ["Предметы", "📚"], ["Вчера и завтра", "📆"], ["Который час?", "⏰"], ["Перемена", "🔔"], ["Я умею", "💪"], ["Домашнее задание", "📓"], ["Контрольная", "📝"]]], ["Транспорт", "🚌", [["На остановке", "🚏"], ["Такси", "🚕"], ["Направо, налево", "↔️"], ["Далеко и близко", "📍"], ["Сколько ехать?", "⏱️"], ["На велосипеде", "🚲"], ["Правила дороги", "🚦"], ["Я опаздываю!", "🏃"], ["Забыл сумку", "🎒"]]], ["Прогулка", "🗺️", [["Где находится?", "🧭"], ["Здания", "🏦"], ["Адрес", "🏠"], ["Карта", "🗺️"], ["Музей", "🏛️"], ["Кино", "🎬"], ["Библиотека", "📖"], ["Торговый центр", "🛍️"], ["Вечерняя прогулка", "🌃"]]]];
const PER=10;
const LESSON_URL={1:'lesson.html',2:'lesson2.html'};
let done=0, pts=0, chestOpened=false; try{ done=+localStorage.getItem('almaMapDone')||0; pts=+localStorage.getItem('almaPts')||0; chestOpened=localStorage.getItem('almaChest1')==='1'; }catch(e){}
function save(){ try{ localStorage.setItem('almaMapDone',done); localStorage.setItem('almaPts',pts); localStorage.setItem('almaChest1',chestOpened?'1':'0'); }catch(e){} }

let AC=null; function ac(){ try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){} return AC; }
function tone(f,t=.08,type='triangle',v=.1,d=0){ const c=ac(); if(!c) return; const o=c.createOscillator(),g=c.createGain(),s=c.currentTime+d; o.type=type; o.frequency.value=f; g.gain.setValueAtTime(v,s); g.gain.exponentialRampToValueAtTime(.001,s+t); o.connect(g); g.connect(c.destination); o.start(s); o.stop(s+t+.02); }
function toast(t){ const e=$('toast'); e.textContent=t; e.classList.add('on'); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('on'),1600); }

const flagSVG='<svg class="flag" viewBox="0 0 30 40"><rect x="3" y="2" width="3" height="38" rx="1.5" fill="#b07a2a"/><circle cx="4.5" cy="3" r="3" fill="#ffd34a"/><path d="M6 5 Q18 3 28 9 Q18 15 6 13Z" fill="#ff7a2e" stroke="#c24f10" stroke-width="1.2"/></svg>';
function render(){
  document.querySelectorAll('.node').forEach(n=>n.remove());
  NODES.forEach(([x,y,w,h],i)=>{
    const n=i+1, b=document.createElement('button'); b.className='node abs';
    b.style.left=(x/W*100)+'%'; b.style.top=(y/H*100)+'%'; b.style.width=(w*1.04/W*100)+'%'; b.style.height=(h*1.08/H*100)+'%'; b.style.fontSize=(w/W*100*0.5)+'cqw';
    const st=topicState(n); b.classList.add(st); 
    b.innerHTML='<div class="tint"></div><div class="num">'+(st==='locked'?'🔒':TOPICS[n-1][1])+'</div>'+(st==='cur'?'<img class="flag" src="img/flag.png" alt="">':'');
    b.onclick=()=>{ ac();
      tone(660); openStart(n); };
    $('map').appendChild(b);
  });
  const ch=$('chestHit'); ch.className='abs '+(chestOpened?'':done>=100?'ready':''); $('ptsN').textContent=pts;
}
function topicState(t){ return done>=t*PER?'done': done>=(t-1)*PER?'cur':'locked'; }
function lessonState(t,k){ const g=(t-1)*PER+k; return g<=done?'done': g===done+1?'cur':'locked'; }
function startLesson(t,k){ tone(880); $('deckBox').classList.remove('on'); if(t===1&&k===1) intro(); else if(t===1){ setTimeout(()=>location.href='t1.html?l='+k,250); } else if(t===2){ setTimeout(()=>location.href='court.html?l='+k,250); } else if(t===3){ setTimeout(()=>location.href='home.html?l='+k,250); } else toast((k===10?'Тест':'Урок '+k)+' скоро появится ✨'); }
function openStart(t){
  const T=TOPICS[t-1], G=$('grid'); G.innerHTML='';
  $('gHead').querySelector('b').textContent='Тема '+t+' · '+T[0];
  for(let k=1;k<=10;k++){ const st=lessonState(t,k), d=document.createElement('div'), L=T[2][k-1];
    d.className='blk '+st+(k===10?' test':'');
    if(k===10) d.innerHTML='<div class="ph"><span>⭐</span></div><div class="tx"><b>Тест</b><small>проверь себя</small></div>';
    else d.innerHTML='<div class="ph">'+(L[2]?'<img src="'+L[2]+'" alt="">':'<span>'+L[1]+'</span>')+'</div><b>Урок '+k+'</b>';
    d.onclick=()=>{ ac(); if(st==='locked'){ tone(250,.1,'square',.05); toast('Сначала пройди предыдущие уроки 🙂'); return; } startLesson(t,k); };
    G.appendChild(d); }
  $('deckBox').classList.add('on');
}
$('deckClose').onclick=()=>{ tone(500,.05); $('deckBox').classList.remove('on'); };
$('deckBox').addEventListener('click',e=>{ if(e.target.id==='deckBox') $('deckBox').classList.remove('on'); });
$('chestHit').onclick=async()=>{ ac();
  if(chestOpened){ toast('Сундук уже открыт 🙂'); return; }
  if(done<100){ tone(200,.15,'square',.05); toast('Сундук откроется, когда пройдёшь все 10 тем 🔒'); return; }
  chestOpened=true; $('chestHit').className='abs'; [523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',.12,i*.1));
  const r=$('chestHit').getBoundingClientRect(), m=$('map').getBoundingClientRect(), p=$('pts').getBoundingClientRect();
  const f=document.createElement('div'); f.className='fly'; f.textContent='+50 ⭐'; f.style.left=(r.left-m.left)+'px'; f.style.top=(r.top-m.top)+'px'; $('map').appendChild(f);
  await new Promise(r=>setTimeout(r,60)); f.style.left=(p.left-m.left)+'px'; f.style.top=(p.top-m.top)+'px'; f.style.opacity=0;
  setTimeout(()=>{ f.remove(); pts+=50; save(); $('ptsN').textContent=pts; toast('Раздел 1 пройден! +50 очков 🎉'); },1100);
};

const wait=ms=>new Promise(r=>setTimeout(r,ms));



function growlSnd(){ const c=ac(); if(!c) return; [0,.35].forEach(d=>{ const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+d; o.type='sawtooth'; o.frequency.setValueAtTime(95,t); o.frequency.exponentialRampToValueAtTime(55,t+.4); g.gain.setValueAtTime(.07,t); g.gain.exponentialRampToValueAtTime(.001,t+.45); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+.5); }); }
async function intro(){
  const I=$('intro'), A=$('ia'), B=$('ib'), btn=$('ibtn');
  I.classList.add('on'); A.className='rig'; A.style.cssText=''; IA.reset(); B.classList.remove('on'); btn.classList.remove('on');
  await wait(300);
  A.style.top='calc(100% - 30cqw)'; tone(500,.08); await wait(500);            // peek: only the top of her head
  A.classList.add('look'); await wait(1000); A.classList.remove('look');
  tone(400,.06); tone(800,.12,'triangle',.1,.08);
  A.style.top='calc(100% - 56cqw)'; await wait(380); A.classList.add('squash'); tone(300,.08); await wait(400); A.classList.remove('squash');
  growlSnd(); IA.mood('hungry'); await wait(1000);
  B.innerHTML='Урррр… 😳 Это мой животик!<small>Я так проголодалась… Пойдём в магазин за хлебом?</small>'; B.classList.add('on');
  await wait(500); btn.classList.add('on');
  await new Promise(r=>btn.onclick=()=>{ ac(); tone(880); r(); });
  btn.classList.remove('on'); B.classList.remove('on');
  IA.walk(true); A.classList.add('run'); A.style.top='30%'; A.style.left='45%'; A.style.width='8%';
  for(let i=0;i<5;i++) setTimeout(()=>tone(300+i*40,.05),i*150);
  await wait(650); $('whiteout').style.opacity=1; await wait(450);
  location.href='t1.html?l=1';
}
